<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Candle Bliss</title>

    <style>
        body {
            margin: 0;
            background: #0a1931; /* Dark Blue background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff; /* White container */
            padding: 30px;
            border-radius: 10px;
            width: 70%;
            max-width: 900px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            color: #0a1931;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #0a1931;
            font-weight: bold;
        } /* <-- ADDED styling for nav links */

        .product-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px; /* <-- FIXED: added missing semicolon here */
        }

        .product {
            flex: 1 1 calc(33% - 20px);
            padding: 10px;
            border: 1px solid #DDD;
            border-radius: 8px;
            background: #DDD;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Candle Bliss</h1>
            <nav>
                <!-- # to stay on the page; onclick showPage to switch view -->

                <a href="#" onclick="showPage('home')">Home</a>
                <a href="cart.html">Cart</a>
                <a href="checkout.html">Checkout</a>
                <a href="login.html">Login</a>
            </nav>
        </header>

        <section id="home" class="visible">
            <h2>Our Candles</h2>
            <div class="product-grid">

                <div class="product">
                    <h3>Lavender Calm</h3>
                    <p>Relaxing lavender scent</p>
                    <button onclick="addToCart('Lavender Calm')">Add to Cart</button>
                </div>

                <div class="product">
                    <h3>Lemon Sweetness</h3>
                    <p>Lemon-citrusy scent</p>
                    <button onclick="addToCart('Lemon Sweetness')">Add to Cart</button>
                </div>

                <div class="product">
                    <h3>Vanilla Dream</h3>
                    <p>Sweet vanilla scent</p>
                    <button onclick="addToCart('Vanilla Dream')">Add to Cart</button>
                </div>

                <div class="product">
                    <h3>Apple Jax</h3>
                    <p>Apple and Cinnamon scent</p>
                    <button onclick="addToCart('Apple Jax')">Add to Cart</button>
                </div>

            </div>
        </section>

        <!-- Shopping cart -->
        <section id="cart" class="hidden">
            <h2>Your Cart</h2>
            <ul id="cart-items"></ul>
        </section>

        <!-- ADDED: placeholder for checkout section so showPage('checkout') works -->
        <section id="checkout" class="hidden">
            <h2>Checkout Page</h2>
        </section>

        <!-- ADDED: placeholder for login section so showPage('login') works -->
        <section id="login" class="hidden">
            <h2>Login Page</h2>
        </section>

        <script>
            const pages = ['home', 'cart', 'checkout', 'login'];
            const cart = [];

            function showPage(page) {
                pages.forEach(p => {
                    document.getElementById(p).classList.add('hidden');
                });
                document.getElementById(page).classList.remove('hidden');
            }

            function addToCart(product) {
                cart.push(product);
                localStorage.setItem("cart", JSON.stringify(cart)); // Save the updated cart
                updateCart();
            }


            function updateCart() {
                const list = document.getElementById('cart-items');
                list.innerHTML = '';
                
                cart.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    list.appendChild(li);
                });
            }
        </script>
    </div>
</body>
</html>
