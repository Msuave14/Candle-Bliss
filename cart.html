<!-- cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Your Cart - Candle Bliss</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .button {
            background: #0a1931;
            color: white;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            color: #0a1931;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #eee;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <p id="empty-msg">Your cart is empty.</p>
    </div>

    <div class="button">
        <a href="CanWeb.html"><button>Home</button></a>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem("cart")) || [];

        const list = document.getElementById('cart-items');
        const emptyMsg = document.getElementById('empty-msg');

        if (cart.length > 0) {
            emptyMsg.style.display = "none";
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
